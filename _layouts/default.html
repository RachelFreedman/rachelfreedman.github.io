<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ page.title }}</title>

	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-154013848-1"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());
	  gtag('config', 'UA-154013848-1');
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>
	<div class="wrap">
		<header class="site-header">
			<div class="wordmark">R. Freedman</div>
			<nav>
				<a href="/"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
				<a href="/publications/"{% if page.url contains '/publications' %} class="active"{% endif %}>Publications</a>
				<a href="/assets/cv.pdf" class="plain">CV</a>
			</nav>
		</header>

		{{ content }}

		{% if page.url != '/' %}
		<footer class="site-footer">
			<a href="mailto:rachel.freedman@berkeley.edu">email</a>
			<a href="https://scholar.google.com/citations?user=Mj1fmhsAAAAJ">google scholar</a>
			<a href="https://x.com/FreedmanRach">twitter</a>
			<a href="https://github.com/rachelfreedman">github</a>
		</footer>
		{% endif %}
	</div>

	<script>
	(function () {
		var els = [].slice.call(document.querySelectorAll('[data-reveal]'));
		var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		function show(el) { el.style.opacity = '1'; el.style.transform = 'none'; }
		if (reduce || !('IntersectionObserver' in window)) { els.forEach(show); return; }
		els.forEach(function (el, i) { setTimeout(function () { show(el); }, 60 + i * 110); });
	})();
	</script>
</body>
</html>
